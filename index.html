<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>게임 모음</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f2ec;--fg:#1d1d1b;--card:#fffdf8;--line:#d8d3c6;--btn:#1d1d1b;--btnfg:#fffdf8}
@media (prefers-color-scheme:dark){:root{--bg:#14151a;--fg:#ecebe6;--card:#1d1f26;--line:#33363f;--btn:#ecebe6;--btnfg:#14151a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;display:flex;flex-direction:column;align-items:center;padding:24px 16px 40px}
h1{font-size:24px;margin:8px 0 2px}
p.sub{margin:0 0 20px;font-size:13px;opacity:.7}
#list{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
a.game{display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;transition:transform .15s,opacity .15s}
a.game:active{transform:scale(.97)}
a.game.soon{opacity:.45;pointer-events:none}
.emoji{font-size:30px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(128,128,128,.12);flex:none}
.meta{flex:1;min-width:0}
.meta b{display:block;font-size:17px;margin-bottom:2px}
.meta span{display:block;font-size:12.5px;opacity:.65}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--btn);color:var(--btnfg);flex:none}
</style>
</head>
<body>
<h1>🎮 게임 모음</h1>
<p class="sub">하고 싶은 게임을 눌러주세요</p>
<div id="list">
  <a class="game" href="ballfight/">
    <div class="emoji">⚾</div>
    <div class="meta"><b>볼파이트</b><span>공끼리 튕기며 싸우는 오토배틀러</span></div>
    <div class="tag">플레이</div>
  </a>
  <a class="game" href="brawl/">
    <div class="emoji">🏝️</div>
    <div class="meta"><b>난투 아일랜드</b><span>하늘 섬에서 싸우는 대난투식 대전</span></div>
    <div class="tag">플레이</div>
  </a>
  <a class="game" href="katana/">
    <div class="emoji">🗡️</div>
    <div class="meta"><b>카타나 1인칭</b><span>1인칭 칼싸움 · PC 마우스 전용 · 유혈 주의</span></div>
    <div class="tag">플레이</div>
  </a>
</div>
</body>
</html>
